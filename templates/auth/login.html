{% extends 'base.html' %}

{% block title %}Sign In — MoodMate{% endblock %}

{% block content %}
<div class="auth-page-container">
    <div class="auth-card card-shadow">
        <div class="auth-card-header text-center">
            <div class="auth-avatar-icon">🌸</div>
            <h2>Welcome Back</h2>
            <p>Step back into your calm, comforting sanctuary</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}" class="auth-form" id="loginForm" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <div class="input-with-icon">
                    <i class="fa-regular fa-envelope input-icon"></i>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-input" 
                        placeholder="you@example.com" 
                        value="{{ email or '' }}" 
                        required 
                        autocomplete="email"
                        autofocus
                    >
                </div>
            </div>

            <div class="form-group">
                <div class="label-with-link">
                    <label for="password" class="form-label">Password</label>
                    <a href="{{ url_for('forgot_password') }}" class="subtle-link">Forgot password?</a>
                </div>
                <div class="input-with-icon password-input-wrap">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-input" 
                        placeholder="••••••••" 
                        required 
                        autocomplete="current-password"
                    >
                    <button type="button" class="password-toggle-btn" id="togglePasswordBtn" aria-label="Toggle password visibility">
                        <i class="fa-regular fa-eye" id="toggleEyeIcon"></i>
                    </button>
                </div>
            </div>

            <div class="form-check-group">
                <label class="custom-checkbox">
                    <input type="checkbox" name="remember" id="remember" checked>
                    <span class="checkmark"></span>
                    <span class="checkbox-label">Keep me signed in</span>
                </label>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-auth" id="loginSubmitBtn">
                <span>Sign In</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div class="auth-card-footer text-center">
            <p>New to MoodMate? <a href="{{ url_for('register') }}" class="auth-action-link">Create your free account</a></p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Password visibility toggle
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const passwordInput = document.getElementById('password');
    const toggleEyeIcon = document.getElementById('toggleEyeIcon');

    if (toggleBtn && passwordInput && toggleEyeIcon) {
        toggleBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            toggleEyeIcon.className = isPassword ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
        });
    }
</script>
{% endblock %}
