services:
  - type: web
    name: moodmate
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

# External database: Neon PostgreSQL is connected via the DATABASE_URL environment variable configured in Render Dashboard.
# (Render's internal free database plan is disabled to prevent 30-day expirations and container resets).
